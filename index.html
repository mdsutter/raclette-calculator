<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur Raclette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #d97745 0%, #8f3d2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #fffaf3;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            position: relative;
        }

        .language-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 5px;
        }

        .lang-btn {
            background: #f4e7d8;
            border: 2px solid #dfc8b3;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s;
            color: #765342;
        }

        .lang-btn.active {
            background: #b94f2f;
            color: white;
            border-color: #b94f2f;
        }

        .lang-btn:hover {
            border-color: #b94f2f;
        }

        h1 {
            color: #3d2d26;
            margin-top: 25px;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2.5em;
        }

        .subtitle {
            color: #765342;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .input-section {
            margin-bottom: 35px;
            text-align: center;
        }

        label {
            display: block;
            color: #654d40;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            font-size: 1.2em;
            border: 2px solid #b94f2f;
            border-radius: 8px;
            text-align: center;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #8f3d2e;
            box-shadow: 0 0 0 3px rgba(143, 61, 46, 0.12);
        }

        .results {
            background: #fff4e8;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #ead9c8;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .ingredient-name {
            font-weight: 600;
            color: #3d2d26;
            font-size: 1.05em;
        }

        .ingredient-quantity {
            color: #b94f2f;
            font-weight: 700;
            font-size: 1.3em;
        }

        .info-box {
            background: #fff1df;
            border-left: 4px solid #b94f2f;
            padding: 15px;
            border-radius: 5px;
            color: #654d40;
            font-size: 0.95em;
            margin-top: 20px;
            line-height: 1.6;
        }

        .info-box strong {
            color: #3d2d26;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="language-toggle">
            <button class="lang-btn active" data-lang="fr" onclick="setLanguage('fr')">FR</button>
            <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
        </div>

        <h1 data-i18n="title">Soirée Raclette</h1>
        <p class="subtitle" data-i18n="subtitle">Calculateur d'ingrédients</p>

        <div class="input-section">
            <label for="numPeople" data-i18n="label-people">Nombre de personnes :</label>
            <input type="number" id="numPeople" min="1" max="100" value="4" placeholder="Entrez le nombre de personnes">
        </div>

        <div class="results">
            <div class="result-item">
                <span class="ingredient-name" data-i18n="ingredient-cheese">🧀 Fromage Raclette</span>
                <span class="ingredient-quantity"><span id="cheese">600</span> g</span>
            </div>
            <div class="result-item">
                <span class="ingredient-name" data-i18n="ingredient-charcuterie">🍖 Charcuterie</span>
                <span class="ingredient-quantity"><span id="charcuterie">500</span> g</span>
            </div>
            <div class="result-item">
                <span class="ingredient-name" data-i18n="ingredient-potatoes">🥔 Pommes de terre</span>
                <span class="ingredient-quantity"><span id="potatoes">900</span> g</span>
            </div>
        </div>

        <div class="info-box">
            <strong data-i18n="info-ratios">Ratios par personne :</strong><br>
            <span data-i18n="info-cheese">• Fromage Raclette : 150g</span><br>
            <span data-i18n="info-charcuterie">• Charcuterie : 125g</span><br>
            <span data-i18n="info-potatoes">• Pommes de terre : 225g</span>
        </div>
    </div>

    <script>
        const translations = {
            fr: {
                'title': 'Soirée Raclette',
                'subtitle': 'Calculateur d\'ingrédients',
                'label-people': 'Nombre de personnes :',
                'ingredient-cheese': '🧀 Fromage Raclette',
                'ingredient-charcuterie': '🍖 Charcuterie',
                'ingredient-potatoes': '🥔 Pommes de terre',
                'info-ratios': 'Ratios par personne :',
                'info-cheese': '• Fromage Raclette : 150g',
                'info-charcuterie': '• Charcuterie : 125g',
                'info-potatoes': '• Pommes de terre : 225g'
            },
            en: {
                'title': 'Raclette Party',
                'subtitle': 'Ingredient Calculator',
                'label-people': 'Number of people:',
                'ingredient-cheese': '🧀 Raclette Cheese',
                'ingredient-charcuterie': '🍖 Charcuterie',
                'ingredient-potatoes': '🥔 Potatoes',
                'info-ratios': 'Per person ratios:',
                'info-cheese': '• Raclette cheese: 150g',
                'info-charcuterie': '• Charcuterie: 125g',
                'info-potatoes': '• Potatoes: 225g'
            }
        };

        const CHEESE_PER_PERSON = 150;
        const CHARCUTERIE_PER_PERSON = 125;
        const POTATOES_PER_PERSON = 225;

        const numPeopleInput = document.getElementById('numPeople');
        const cheeseSpan = document.getElementById('cheese');
        const charcuterieSpan = document.getElementById('charcuterie');
        const potatoesSpan = document.getElementById('potatoes');
        let currentLanguage = localStorage.getItem('raclette-language') || 'fr';

        function formatNumber(num, lang) {
            if (lang === 'fr') {
                return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            } else {
                return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            }
        }

        function updateCalculation() {
            const numPeople = parseInt(numPeopleInput.value) || 0;

            const cheese = numPeople * CHEESE_PER_PERSON;
            const charcuterie = numPeople * CHARCUTERIE_PER_PERSON;
            const potatoes = numPeople * POTATOES_PER_PERSON;
            cheeseSpan.textContent = formatNumber(cheese, currentLanguage);
            charcuterieSpan.textContent = formatNumber(charcuterie, currentLanguage);
            potatoesSpan.textContent = formatNumber(potatoes, currentLanguage);
        }

        function setLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('raclette-language', lang);

            // Update all translated elements
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                element.textContent = translations[lang][key];
            });

            // Update language buttons
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-lang="${lang}"]`).classList.add('active');

            // Update placeholder
            numPeopleInput.placeholder = lang === 'fr' 
                ? 'Entrez le nombre de personnes' 
                : 'Enter number of people';

            // Recalculate with new format
            updateCalculation();

            // Update document language
            document.documentElement.lang = lang;
        }

        numPeopleInput.addEventListener('input', updateCalculation);
        numPeopleInput.addEventListener('change', updateCalculation);

        // Initialize with saved language
        setLanguage(currentLanguage);
    </script>
</body>
</html>
